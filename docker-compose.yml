
services:
  postgres:
    image:  postgres:15-alpine
    container_name:  postgres
    environment:
      POSTGRES_DB:  earthquake_db
      POSTGRES_USER:  postgres
      POSTGRES_PASSWORD:  12345
    ports: 
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d earthquake_db"]
      interval:  5s
      timeout:  5s
      retries:  5
volumes:
  postgres-data:

